[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fren"
version = "0.1.0a0"
description = "Executable conformance and provenance core for the FREN relational AI architecture"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
fren = "fren.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
